<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio - Sessoes</title>
</head>
<body>
    <h1>Sessões</h1>

    <p><a href="/principal">Voltar</a></p>

    <table border="1">
        <tr>
            <th>Data</th>
            <th>projeto</th>
            <th>Cliente</th>
            <th>Alterar data</th>

        </tr>
        {{#agendamentos}}
        <tr>
            <td>{{data_br}}</td>
            <td>{{projeto_id}}</td>
            <td>{{Cliente_nome}}</td>
            <td>
                <form method="POST" action="/sessoes/{{id}}">
                    <input type="hidden" name="_method" value="PUT"/>
                    <input type="datetime-local" name="data_sessoes" value="{{data_input}}" required/>
                    <button>Salvar</button>
                </form>
            </td>
            <td>
                <form method="POST" action="/sessoes/{{id}}">
                    <input type="hidden" name="_method" value="DELETE"/>
                    <button>Excluir</button>
                </form>
            </td>
        </tr>
        {{/sessoes}}
    </table>

    <h2>Cadastrar</h2>
    <form method="POST" action="/sessoes">
        <select name="projeto_id" required>
            <option value="">Selecione o projeto</option>
            {{#projetos}}
            <option value="{{id}}">{{projeto}} - {{cliente}}</option>
            {{/projetos}}
        </select>
        <input type="datetime-local" name="data_sessoes" required/>
        <input type="text" name="projeto" placeholder="projeto"/>
        <button>Cadastrar</button>
    </form>
</body>
</html>
